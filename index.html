    /* Phone layout: the canvas fills the screen and the touch controls float on top */
    body.mobile {
        margin: 0;
        overflow: hidden;
        background-image: none;
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
    }
    body.mobile canvas {
        position: fixed;
        left: 0;
        top: 0;
        border: none !important;
    }
    body.mobile > p {
        display: none;
    }
    body.mobile #logoLoading {
        width: 60vmin;
        margin-top: 10vh;
    }
    #touchUI {
        position: fixed;
        inset: 0;
        z-index: 10;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Agency FB", Arial, sans-serif;
    }
    #touchUI .tbtn {
        display: none;
        position: absolute;
        width: 13vmin;
        height: 13vmin;
        border-radius: 50%;
        border: 0.5vmin solid rgba(255, 255, 255, 0.45);
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.85);
        font: bold 3.4vmin "Agency FB", Arial, sans-serif;
        letter-spacing: 0.1vmin;
        padding: 0;
        line-height: 1;
        -webkit-tap-highlight-color: transparent;
    }
    #touchUI.ingame .tbtn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #touchUI .tbtn.down {
        background: rgba(180, 20, 20, 0.6);
        border-color: rgba(255, 255, 255, 0.8);
    }
    #touchUI .tbtn small {
        font-size: 2.4vmin;
        opacity: 0.7;
    }
    #touchUI #tPause { left: 2vmin; top: 2vmin; width: 9vmin; height: 9vmin; font-size: 3vmin; }
    #touchUI #tUse { right: 22vmin; bottom: 34vmin; width: 17vmin; height: 17vmin; font-size: 4.4vmin; border-color: rgba(255, 215, 90, 0.7); }
    #touchUI #tReload { right: 5vmin; bottom: 47vmin; }
    #touchUI #tKnife { right: 3vmin; bottom: 31vmin; }
    #touchUI #tSwap { right: 20vmin; top: 3vmin; }
    #touchUI #tNade { right: 4vmin; top: 3vmin; }
    #touchUI .stick {
        display: none;
        position: absolute;
        width: 22vmin;
        height: 22vmin;
        margin: -11vmin 0 0 -11vmin;
        border-radius: 50%;
        border: 0.5vmin solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.2);
        pointer-events: none;
    }
    #touchUI.ingame .stick.active {
        display: block;
    }
    #touchUI .stick .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9vmin;
        height: 9vmin;
        margin: -4.5vmin 0 0 -4.5vmin;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
    }
    #rotateHint {
        display: none;
    }
    @media (orientation: portrait) {
        #rotateHint {
            display: flex;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 0 10vw;
            text-align: center;

            font: bold 7vw "Agency FB", Arial, sans-serif;

    }
    #offlineStatus {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 2vmin;
        transform: translateX(-50%);
        padding: 0.6em 1.2em;
        border-radius: 1em;

    #padCursor {

        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 2px #b00, 0 0 8px #000;
        pointer-events: none;
    }

    <div id="offlineStatus" hidden></div>
    <script>
        //Offline play: sw.js stores the game on the device after the first visit
        const offlineSupported = "serviceWorker" in navigator && location.protocol !== "file:"
        if (offlineSupported) {
            navigator.serviceWorker.register("sw.js")
            let hideTimer = null
            navigator.serviceWorker.addEventListener("message", e => {
                if (e.data == null || e.data.type !== "cache-progress") return
                const status = document.getElementById("offlineStatus")
                const {done, failed, total} = e.data
                status.hidden = false
                clearTimeout(hideTimer)
                if (done < total) {
                    status.textContent = "Saving game for offline play... " + Math.floor(done / total * 100) + "%"
                } else if (failed > 0) {
                    status.textContent = "Couldn't save " + failed + " files for offline play. Open the game again with internet to finish."
                    hideTimer = setTimeout(() => status.hidden = true, 8000)
                } else {
                    status.textContent = "Saved for offline play"
                    hideTimer = setTimeout(() => status.hidden = true, 3000)
                }
            })
        }
        //Called by Main.js once the game has loaded, so the download doesn't slow down the first start
        function cacheGameForOffline() {
            if (!offlineSupported || !MOBILE_MODE) return
            navigator.serviceWorker.ready.then(registration => registration.active.postMessage("cache-all"))
        }
    </script>
